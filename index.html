<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部活将棋</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="topbar" aria-label="ゲーム情報">
      <div>
        <h1>部活将棋</h1>
        <p id="statusText">準備中</p>
      </div>
      <div class="controls">
        <label>
          対戦校
          <select id="schoolSelect"></select>
        </label>
        <button id="spectatorButton" type="button">観戦モード</button>
        <button id="restartButton" type="button">再戦</button>
      </div>
    </section>

    <section class="play-area">
      <aside class="panel" aria-label="選択中の駒">
        <h2>選択</h2>
        <div id="selectionPanel" class="selection-panel">あなたの駒を選択</div>
        <h2>戦況</h2>
        <dl class="stats">
          <div><dt>手番</dt><dd id="turnStat">-</dd></div>
          <div><dt>あなたの捕獲</dt><dd id="blueCaptured">0</dd></div>
          <div><dt>CPUの捕獲</dt><dd id="redCaptured">0</dd></div>
        </dl>
        <h2>履歴</h2>
        <ol id="moveHistory" class="move-history"></ol>
      </aside>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="学校盤面"></div>
        <div id="moveTrail" class="move-trail" aria-hidden="true">
          <span class="move-trail-line"></span>
        </div>
        <div id="checkBanner" class="check-banner" aria-live="assertive"></div>
      </div>

      <aside class="panel legend" aria-label="地形">
        <h2>地形</h2>
        <div id="terrainLegend"></div>
        <h2>駒</h2>
        <div id="clubLegend"></div>
      </aside>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/board.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
  <script src="js/cpu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
