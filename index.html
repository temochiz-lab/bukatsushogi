<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部活将棋 高校生編</title>
  <script>document.documentElement.classList.toggle("mobile-layout", new URLSearchParams(location.search).get("mobile") === "on");</script>
  <link rel="stylesheet" href="style.css?v=20260909-28">
</head>
<body>
  <main class="app-shell">
    <section class="topbar" aria-label="ゲーム情報">
      <div>
        <h1>部活将棋 高校生編</h1>
        <p id="statusText">準備中</p>
      </div>
      <section id="cpuCommandPanel" class="player-command-panel" aria-label="CPU強度と全体作戦">
        <div id="blueCpuControls" class="cpu-strength-block" hidden>
          <div class="player-command-head"><strong>自分CPU強度</strong><span data-cpu-strategy="blue">矢倉</span></div>
          <div class="player-time-bank" aria-label="青CPUの残り時間">
            <button type="button" class="cpu-time-card" data-cpu-side="blue" data-cpu-difficulty="easy">
              <span>初級</span><strong data-cpu-time>無制限</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </button>
            <button type="button" class="cpu-time-card" data-cpu-side="blue" data-cpu-difficulty="normal">
              <span>中級</span><strong data-cpu-time>3:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </button>
            <button type="button" class="cpu-time-card" data-cpu-side="blue" data-cpu-difficulty="hard">
              <span>上級</span><strong data-cpu-time>2:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </button>
            <button type="button" class="cpu-time-card" data-cpu-side="blue" data-cpu-difficulty="expert">
              <span>最上級</span><strong data-cpu-time>2:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </button>
          </div>
        </div>
        <div id="redCpuControls" class="cpu-strength-block">
          <div class="player-command-head"><strong>相手CPU強度</strong><span data-cpu-strategy="red">未定</span></div>
          <div class="player-time-bank" aria-label="赤CPUの残り時間">
            <div class="cpu-time-card" data-cpu-side="red" data-cpu-difficulty="easy">
              <span>初級</span><strong data-cpu-time>無制限</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </div>
            <div class="cpu-time-card" data-cpu-side="red" data-cpu-difficulty="normal">
              <span>中級</span><strong data-cpu-time>3:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </div>
            <div class="cpu-time-card" data-cpu-side="red" data-cpu-difficulty="hard">
              <span>上級</span><strong data-cpu-time>2:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </div>
            <div class="cpu-time-card" data-cpu-side="red" data-cpu-difficulty="expert">
              <span>最上級</span><strong data-cpu-time>2:00</strong>
              <i class="cpu-time-track" aria-hidden="true"><i data-cpu-time-bar></i></i>
            </div>
          </div>
        </div>
      </section>
      <div class="controls">
        <label for="schoolSelect">
          対戦相手
          <select id="schoolSelect"></select>
        </label>
        <button id="modeToggleButton" class="mode-toggle start" type="button" hidden>自動操作</button>
        <button id="deckButton" type="button" hidden>編成</button>
      </div>
    </section>

    <section id="deckSetup" class="deck-setup" aria-label="デッキ編成"></section>

    <section class="play-area">
      <aside class="panel" aria-label="選択中の駒">
        <h2>選択</h2>
        <div id="selectionPanel" class="selection-panel">あなたの駒を選択</div>
        <h2>戦況</h2>
        <dl class="stats">
          <div><dt>手番</dt><dd id="turnStat">-</dd></div>
          <div><dt>あなたの捕獲</dt><dd id="blueCaptured">0</dd></div>
          <div><dt>CPUの捕獲</dt><dd id="redCaptured">0</dd></div>
        </dl>
        <h2>履歴</h2>
        <ol id="moveHistory" class="move-history"></ol>
      </aside>

      <div class="battlefield">
        <aside id="redCapturedTray" class="captured-tray captured-tray-left" aria-label="CPUが取った駒"></aside>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="学校盤面"></div>
          <div id="moveTrail" class="move-trail" aria-hidden="true">
            <span class="move-trail-line"></span>
          </div>
          <div id="checkBanner" class="check-banner" aria-live="assertive"></div>
          <div id="resultDialog" class="result-dialog" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
            <h2 id="resultTitle">勝利</h2>
            <p id="resultMessage">対局が終了しました。</p>
            <div class="result-actions">
              <button type="button" data-result-action="new">新規</button>
              <button type="button" data-result-action="replay">棋譜再現</button>
            </div>
          </div>
        </div>
        <aside id="blueCapturedTray" class="captured-tray captured-tray-right" aria-label="あなたが取った駒"></aside>
      </div>

      <aside class="panel legend" aria-label="部活"><div id="clubLegend"></div>
      </aside>
    </section>
  </main>

  <script src="js/config.js?v=20260909-30"></script>
  <script src="js/pieces.js?v=20260909-30"></script>
  <script src="js/board.js?v=20260909-23"></script>
  <script src="js/rules.js?v=20260909-23"></script>
  <script src="js/game.js?v=20260909-23"></script>
  <script src="js/cpu.js?v=20260909-25"></script>
  <script src="js/main.js?v=20260909-29"></script>
</body>
</html>
